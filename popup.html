<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Overlay Composer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Tab Overlay</h1>
      <p class="hint">Pick a source tab, capture it, then overlay it at 50% opacity on a target tab.</p>

      <label for="sourceTab">Source tab</label>
      <select id="sourceTab"></select>
      <button id="captureButton">Capture source</button>

      <label for="targetTab">Target tab</label>
      <select id="targetTab"></select>
      <button id="overlayButton" disabled>Overlay on target</button>
      <button id="clearButton">Clear target overlay</button>

      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
